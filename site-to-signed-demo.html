<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Site-to-Signed · Hamilton County BOV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#0A1A33; --panel:#102A4C; --panel2:#163760; --line:#2A4A78;
  --txt:#E8EDF2; --mut:#93A4C0; --amber:#60A5FA; --amber-dim:#2563EB;
  --green:#3DBE7B; --red:#E5484D; --blue:#38BDF8; --paper:#FAF7F0; --paper-ink:#23282E;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --disp:'Archivo',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font:15px/1.45 var(--disp)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
#map{position:absolute;inset:0;z-index:1;background:#0d1319}
.leaflet-container{font-family:var(--disp)}

#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px;display:flex;gap:8px;align-items:center;pointer-events:none}
#topbar>*{pointer-events:auto}
#brand{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:600 11px/1 var(--mono);letter-spacing:.12em;color:var(--amber);white-space:nowrap}
#searchwrap{flex:1;display:flex;background:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
#search{flex:1;background:none;border:none;outline:none;color:var(--txt);padding:10px 12px;font-size:14px;min-width:0}
#search::placeholder{color:var(--mut)}
#gobtn{padding:0 14px;color:var(--amber);font:600 12px var(--mono)}
#locbtn{background:var(--ink);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--amber);flex:none}
#modebar{position:absolute;top:58px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:6px}
.modebtn{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 10px var(--mono);color:var(--mut);letter-spacing:.06em}
.modebtn.on{color:var(--amber);border-color:var(--amber-dim)}
#banner{position:absolute;top:58px;left:12px;right:62px;z-index:999;display:none;background:#13294D;border:1px solid var(--amber-dim);border-radius:8px;padding:8px 12px;font:500 11px/1.4 var(--mono);color:var(--amber)}
#banner.show{display:block}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:88px;z-index:998;background:rgba(10,26,51,.88);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:99px;padding:9px 18px;font:500 12px var(--mono);color:var(--mut);white-space:nowrap;transition:opacity .4s}
#hint.gone{opacity:0;pointer-events:none}
#asmbar{position:absolute;left:50%;transform:translateX(-50%);top:104px;z-index:1002;display:none;background:var(--amber);color:#0A2342;border-radius:99px;padding:9px 8px 9px 16px;font:700 12px var(--mono);letter-spacing:.04em;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#asmbar.show{display:flex}
#asmbar button{background:#0A2342;color:var(--amber);border-radius:99px;padding:6px 13px;font:700 11px var(--mono)}
#measbar{position:absolute;left:50%;transform:translateX(-50%);top:104px;z-index:1002;display:none;background:var(--blue);color:#0B1A2B;border-radius:99px;padding:9px 8px 9px 16px;font:700 12px var(--mono);letter-spacing:.03em;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
#measbar.show{display:flex}
#measbar button{background:#0B1A2B;color:var(--blue);border-radius:99px;padding:6px 11px;font:700 10.5px var(--mono)}
.bldg-tip{background:rgba(10,26,51,.92)!important;border:1px solid var(--blue)!important;border-radius:6px!important;color:var(--blue)!important;font:600 10px var(--mono)!important;padding:2px 6px!important;box-shadow:none!important}
.bldg-tip::before{display:none}
.bldg-pop .leaflet-popup-content-wrapper{background:var(--ink);color:var(--txt);border:1px solid var(--line);border-radius:10px;font:500 12px var(--mono)}
.bldg-pop .leaflet-popup-tip{background:var(--ink);border:1px solid var(--line)}
.bldg-pop .pb{display:block;width:100%;margin-top:8px;background:var(--blue);color:#0B1A2B;border-radius:7px;padding:7px;font:700 11px var(--mono);text-align:center}
.bldg-pop .pb.ex{background:none;border:1px solid var(--blue);color:var(--blue)}
.measuring .leaflet-interactive{pointer-events:none!important}
.measuring{cursor:crosshair}
.mydata-tip{background:rgba(10,26,51,.92)!important;border:1px solid #818CF8!important;border-radius:6px!important;color:#818CF8!important;font:600 10px var(--mono)!important;padding:2px 7px!important;box-shadow:none!important;white-space:nowrap}
.mydata-tip::before{display:none}
#mydbtn.on{color:#818CF8!important;border-color:#4F46E5!important}
.zoomfar .mydata-tip{display:none!important}
.fbar{display:flex;gap:8px;margin:0 0 10px}
.fbar label{flex:1;display:flex;flex-direction:column;gap:3px;font:600 8.5px var(--mono);letter-spacing:.12em;color:var(--mut)}
.fsel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 6px;font:600 11px var(--mono);outline:none;width:100%;-webkit-appearance:none;appearance:none}
.fsel:focus{border-color:var(--amber-dim)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,.27,1);max-height:88vh;display:flex;flex-direction:column}
#sheet.peek{transform:translateY(calc(100% - 248px))}
#sheet.open{transform:translateY(0)}
#grab{padding:10px 0 4px;display:grid;place-items:center;flex:none;cursor:grab}
#grab::before{content:'';width:42px;height:4px;border-radius:99px;background:var(--line)}
#sheetbody{overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}

.eyebrow{font:600 10px var(--mono);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.addr{font:700 21px/1.15 var(--disp);font-stretch:112%;margin:3px 0 1px}
.owner{font:500 13px var(--mono);color:var(--amber);margin-bottom:8px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font:600 11px var(--mono)}
.chip small{color:var(--mut);font-weight:500;font-size:9px;letter-spacing:.08em}
.chip.asm{border-color:var(--amber-dim);color:var(--amber)}
.btnrow{display:flex;gap:8px}
.cta{flex:1;background:var(--amber);color:#0A2342;border-radius:11px;padding:13px;font:700 14.5px var(--disp);font-stretch:108%;display:flex;justify-content:center;gap:8px;align-items:center}
.cta:active{transform:scale(.985)}
.cta.ghost{background:none;border:1px solid var(--line);color:var(--txt);font-weight:600}
.cta:disabled{opacity:.45}
.cta.sm{padding:10px;font-size:13px;border-radius:9px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.cell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.cell .k{font:500 9px var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.cell .v{font:600 14px var(--mono);margin-top:3px;word-break:break-word}
.cell .v small{font-size:10px;color:var(--mut);font-weight:500}
.cell.wide{grid-column:1/-1}
.sec{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sec .act{color:var(--amber);letter-spacing:.06em;font-weight:600}
.note{font:500 11px/1.5 var(--mono);color:var(--mut);margin:6px 0 12px}
.backbtn{font:600 12px var(--mono);color:var(--amber);padding:6px 0 10px;letter-spacing:.06em}

.field{margin-bottom:10px}
.field label{display:block;font:500 9px var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.field input,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font:600 13px var(--mono);outline:none}
.field textarea{font:400 13px/1.5 var(--disp);min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--amber-dim)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.addtile{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--mut);font:600 11px var(--mono)}
.rowitem{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 12px var(--mono)}
.rowitem .x{color:var(--red);font-weight:700;flex:none}
.rowitem .go{color:var(--amber);font-weight:700;flex:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.mini input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px 10px;font:600 12px var(--mono);outline:none;width:100%}
.mini .wide{grid-column:1/-1}

.comphead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.comphead h2{font:700 17px var(--disp);font-stretch:110%}
.comphead .sub{font:500 10px var(--mono);color:var(--mut)}
.comp{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;transition:border-color .15s}
.comp.sel{border-color:var(--amber)}
.scorewrap{flex:none}
.score{width:46px;height:46px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;font:700 15px var(--mono);color:var(--amber);position:relative}
.score.lo{border-color:var(--mut);color:var(--mut)}
.score.bk{border-color:var(--blue);color:var(--blue)}
.score::after{content:'SCORE';position:absolute;bottom:-2px;font-size:5px;letter-spacing:.18em;background:var(--panel2);padding:0 3px;color:inherit;opacity:.85}
.compbody{flex:1;min-width:0}
.compaddr{font:600 13.5px/1.2 var(--disp);font-stretch:106%}
.compdat{font:500 11px var(--mono);color:var(--mut);margin:3px 0 6px}
.compdat b{color:var(--txt);font-weight:600}
.stamps{display:flex;flex-wrap:wrap;gap:5px}
.stamp{font:700 8.5px var(--mono);letter-spacing:.1em;padding:3px 7px;border-radius:3px;border:1.5px solid currentColor;transform:rotate(-1.2deg);text-transform:uppercase}
.stamp.ok{color:var(--green)} .stamp.warn{color:var(--amber)} .stamp.bad{color:var(--red)} .stamp.info{color:var(--blue)}
.pick{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--amber);margin-top:9px}
.comp.sel .pick{border-color:var(--amber);background:rgba(96,165,250,.12)}

#bovwrap{position:absolute;inset:0;z-index:2000;display:none;overflow-y:auto;background:rgba(7,18,38,.92);backdrop-filter:blur(3px);padding:16px 12px 90px}
#bovwrap.show{display:block}
#bov{background:var(--paper);color:var(--paper-ink);max-width:660px;margin:0 auto;border-radius:6px;padding:30px 28px;font-family:var(--disp);box-shadow:0 24px 60px rgba(0,0,0,.5)}
#bov h1{font:800 24px/1.1 var(--disp);font-stretch:115%;margin:2px 0}
#bov .bovsub{font:500 10.5px var(--mono);letter-spacing:.1em;color:#7A848E;text-transform:uppercase}
#bov hr{border:none;border-top:1.5px solid #23282E;margin:14px 0}
#bov h3{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin:16px 0 8px;color:#444C55}
.bovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 18px;font-size:13px}
.bovgrid .k{font:500 9px var(--mono);letter-spacing:.1em;color:#7A848E;text-transform:uppercase}
.bovgrid .v{font:600 13.5px var(--mono)}
#bov table{width:100%;border-collapse:collapse;font:500 10.5px var(--mono);margin-top:4px}
#bov th{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#7A848E;text-align:left;padding:4px 5px;border-bottom:1.5px solid #23282E}
#bov td{padding:6px 5px;border-bottom:1px solid #D9D4C8;vertical-align:top}
#bov td.r,#bov th.r{text-align:right}
.range{background:#23282E;color:var(--paper);border-radius:8px;padding:16px;margin:14px 0;text-align:center}
.range .lab{font:600 9px var(--mono);letter-spacing:.2em;color:#A9B4BF;text-transform:uppercase}
.range .val{font:800 26px var(--disp);font-stretch:112%;margin-top:4px;color:var(--amber)}
.range .per{font:500 11px var(--mono);color:#A9B4BF;margin-top:3px}
.bovphotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.bovphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
#bov textarea{width:100%;border:1px dashed #B9B2A2;border-radius:6px;background:none;padding:9px;font:13px/1.5 var(--disp);color:var(--paper-ink);resize:vertical;min-height:64px;outline:none}
.bovfoot{font:500 9px/1.6 var(--mono);color:#8A8E93;margin-top:16px}
#bovbar{position:fixed;bottom:0;left:0;right:0;z-index:2001;background:var(--ink);border-top:1px solid var(--line);padding:12px;display:none;gap:8px}
#bovwrap.show~#bovbar{display:flex}
#bovbar button{flex:1;border-radius:10px;padding:13px;font:700 13.5px var(--disp)}
#bovbar .b1{background:var(--amber);color:#0A2342}
#bovbar .b2{border:1px solid var(--line);color:var(--txt)}
.spin{width:18px;height:18px;border:2.5px solid rgba(96,165,250,.3);border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:760px){
  #sheet{left:auto;right:14px;bottom:14px;width:440px;border-radius:16px;border:1px solid var(--line);max-height:80vh}
  #sheet.peek{transform:translateY(calc(100% - 248px + 14px))}
}
@media print{
  body>*{display:none!important}
  #bovwrap{display:block!important;position:static;background:#fff;padding:0;overflow:visible}
  #bov{box-shadow:none;max-width:none;border-radius:0}
  #bovbar{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div id="brand">SITE&rarr;SIGNED</div>
  <div id="searchwrap">
    <input id="search" placeholder="Search address — e.g. 4820 Foundry Row" autocomplete="off">
    <button id="gobtn">FIND</button>
  </div>
  <button id="locbtn" title="Use my location" aria-label="Use my location">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
</div>

<div id="modebar">
  <button class="modebtn on" id="satbtn">AERIAL</button>
  <button class="modebtn" id="strbtn">STREETS</button>
  <button class="modebtn" id="measbtn">MEASURE</button>
  <button class="modebtn on" id="mydbtn" onclick="toggleMyData()">MY DATA</button>
</div>

<div id="banner"></div>
<div id="hint">Tap any parcel to pull the county record</div>
<div id="asmbar">ASSEMBLING — tap parcels to add/remove <button onclick="endAssembly()">DONE</button></div>
<div id="measbar"><span id="measout">Tap points to measure</span><button onclick="measUndo()">UNDO</button><button onclick="measClear()">CLEAR</button><button onclick="exitMeasure()">EXIT</button></div>

<div id="sheet">
  <div id="grab"></div>
  <div id="sheetbody"></div>
</div>

<div id="bovwrap"><div id="bov"></div></div>
<div id="bovbar">
  <button class="b2" onclick="view('comps')">Back to comps</button>
  <button class="b1" onclick="window.print()">Print / Save PDF</button>
</div>

<input type="file" id="photoin" accept="image/*" multiple style="display:none">

<script>
/* =====================================================================
   SITE→SIGNED v3
   Parcels:   CAGIS HCE/Cadastral/MapServer/0
   Buildings: CAGIS COUNTYWIDE/PlanimetricLayers/MapServer/6
   New: parcel assemblage (union outline, combined AC/SF/taxes/value),
        owner intel (Ohio SOS deep link, owner portfolio search)
===================================================================== */
const PARCELS  ='https://cagisonline.hamilton-co.org/arcgis/rest/services/HCE/Cadastral/MapServer/0/query';
const BUILDINGS='https://cagisonline.hamilton-co.org/arcgis/rest/services/COUNTYWIDE/PlanimetricLayers/MapServer/6/query';
const VALID_YES=new Set(['Y','1','T','V','YES','TRUE']);
const LOOKBACK_MO=36,LOOKBACK_EXT=60,MIN_SALE=10000,MIN_BLDG=1500;
let radiusMi=3,useFilter='bucket';
function useBounds(){
  if(useFilter==='ind')return{lo:300,hi:399,name:'Industrial'};
  if(useFilter==='com')return{lo:400,hi:499,name:'Commercial'};
  if(useFilter==='any')return{lo:0,hi:999,name:'Any use'};
  return subject&&subject.bucket?subject.bucket:{lo:0,hi:999,name:'Any use'};
}
function useMatch(c){
  if(useFilter==='exact')return c.use===subject.use;
  const b=useBounds();
  return c.cls!=null?(c.cls>=b.lo&&c.cls<=b.hi):true;
}
function savePrefs(){kvSet('comp-prefs',JSON.stringify({radiusMi,useFilter,sizeBand}));}
async function loadPrefs(){
  const v=await kvGet('comp-prefs');
  if(v){try{const p=JSON.parse(v);
    if(p.radiusMi)radiusMi=p.radiusMi;
    if(p.useFilter)useFilter=p.useFilter;
    if(p.sizeBand)sizeBand=p.sizeBand;}catch(e){}}
}
window.setRadius=v=>{radiusMi=Number(v);savePrefs();runComps();};
window.setUse=v=>{useFilter=v;savePrefs();runComps();};
const ENTITY_RX=/\b(LLC|L L C|LTD|INC|CORP|CO|LP|LLP|TRUST|TR|PARTNERS|HOLDINGS|PROPERTIES|REALTY|GROUP)\b/;

let demoMode=false,map,subjLayer,compLayer,parts=[],subject=null,assembling=false;
let compPool=[],selectedIds=new Set(),lastMonths=LOOKBACK_MO,broker={};

/* ---------- map ---------- */
const aerial=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'});
const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
map=L.map('map',{zoomControl:false,layers:[aerial]}).setView([39.2755,-84.4052],16);
subjLayer=L.layerGroup().addTo(map);compLayer=L.layerGroup().addTo(map);
const bldgLayer=L.layerGroup().addTo(map);
satbtn.onclick=()=>{map.addLayer(aerial);map.removeLayer(streets);tog('satbtn')};
strbtn.onclick=()=>{map.addLayer(streets);map.removeLayer(aerial);tog('strbtn')};
measbtn.onclick=()=>{measureMode?exitMeasure():enterMeasure();};
function tog(id){document.querySelectorAll('.modebtn').forEach(b=>{if(b.id!=='measbtn'&&b.id!=='mydbtn')b.classList.toggle('on',b.id===id)})}

/* ---------- MY DATA layer: highlights every parcel with broker-added data ---------- */
let myIndex={},myOn=true;
const myLayer=L.layerGroup().addTo(map);
map.on('zoomend',()=>map.getContainer().classList.toggle('zoomfar',map.getZoom()<15));
function brokerBadge(b){
  const p=[];
  if(b.photos&&b.photos.length)p.push('📷'+b.photos.length);
  if(b.notes)p.push('📝');
  if(b.contacts&&b.contacts.length)p.push('👤'+b.contacts.length);
  if(b.comps&&b.comps.length)p.push('◆'+b.comps.length);
  if(b.sf)p.push('SF✎');
  return p.join(' ');
}
async function updateMyIndex(){
  if(!subject)return;
  const k=skey(subject.id);
  const badge=brokerBadge(broker);
  if(!badge)delete myIndex[k];
  else myIndex[k]={label:subject.address,badge,geoms:parts.map(p=>p.geometry).filter(Boolean)};
  await kvSet('mydata-index',JSON.stringify(myIndex));
  if(myOn)drawMyData();
}
function drawMyData(){
  myLayer.clearLayers();
  Object.values(myIndex).forEach(e=>(e.geoms||[]).forEach(g=>{
    const lyr=L.geoJSON({type:'Feature',geometry:g},{style:{
      color:'#818CF8',weight:2,dashArray:'6 4',fillColor:'#818CF8',fillOpacity:.12}});
    lyr.bindTooltip(e.badge,{permanent:true,direction:'center',className:'mydata-tip'});

/* ---------- ArcGIS plumbing ---------- */
async function arc(url,params){
  const body=new URLSearchParams({f:'geojson',outSR:4326,...params});
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),10000);
  try{
    const r=await fetch(url,{method:'POST',body,signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error)throw new Error(j.error.message||'ArcGIS error');
    return j;
  }catch(e){clearTimeout(t);throw e;}
}
function enterDemo(reason){
  if(demoMode)return;
  demoMode=true;
  banner.textContent='DEMO DATA — CAGIS unreachable from this network ('+reason+'). Sample parcels loaded; full flow is live.';
  banner.classList.add('show');
  map.setView([39.2755,-84.4052],16);
  drawDemoOutlines();
}

/* ---------- identify & assemblage ---------- */
async function identify(lat,lng){
  hideHint();
  let feat=null;
  if(!demoMode){
    try{
      const j=await arc(PARCELS,{geometry:JSON.stringify({x:lng,y:lat,spatialReference:{wkid:4326}}),
        geometryType:'esriGeometryPoint',inSR:4326,spatialRel:'esriSpatialRelIntersects',
        outFields:'*',returnGeometry:true});
      feat=j.features&&j.features[0];
      if(!feat){if(!assembling)toastSheet('No parcel at that point','Tap inside a parcel boundary.');return;}
    }catch(e){enterDemo(e.name==='AbortError'?'timeout':e.message);}
  }
  if(demoMode){
    feat=DEMO.find(f=>ptInPoly([lng,lat],f.geometry.coordinates[0]));
    if(!feat){if(!assembling)toastSheet('No demo parcel here','Tap one of the outlined sample parcels.');return;}
  }
  const part=normalize(feat);
  if(assembling){
    const i=parts.findIndex(p=>p.id===part.id);
    if(i>=0){ if(parts.length>1)parts.splice(i,1); }   // tap again to remove
    else{ parts.push(part); broker=mergeBroker(broker,await rawLoad(part.id)); }
    await rebuildSubject(false,false);
    saveBroker();
  }else{
    // tapping a member of the on-screen assemblage re-opens it, never dissolves it
    if(parts.length>1&&parts.some(p=>p.id===part.id)){view('peek');return;}
    // tapping a parcel that belongs to a saved assemblage restores the whole assemblage
    const ak=asmIndex[skey(part.id)];
    if(ak&&await restoreAssembly(ak))return;
    curAsmKey=null;
    parts=[part];
    await rebuildSubject(true);
  }
}
function startAssembly(){if(measureMode)exitMeasure();assembling=true;asmbar.classList.add('show');sheet.className='peek';}
function endAssembly(){assembling=false;asmbar.classList.remove('show');saveBroker();persistAssembly();view(parts.length>1?'full':'peek');}
window.startAssembly=startAssembly;window.endAssembly=endAssembly;

async function rebuildSubject(fit,reloadBroker=true){
  subject=aggregate(parts);
  drawSubject(fit);
  compPool=[];selectedIds.clear();compLayer.clearLayers();bldgLayer.clearLayers();
  if(reloadBroker)broker=await loadBroker(subject.id);
  saveSession();
  view(assembling?'peek':(parts.length>1?'full':'peek'));
  drawBuildings();
  parts.forEach(p=>{if(p.bldgs==null)fetchPartSF(p);});
}
function bldgArea(p){
  const st=Math.min(4,Math.max(1,num(p.EST_STORY)||num(p.STORYABOVE)||1));
  return(num(p.SQFT)||0)*st;
}
let sessT=null;
function partSnap(p){return{props:p.raw,geometry:p.geometry,bldgSF:p.bldgSF,
  ex:(p.bldgs||[]).map((b,i)=>b.excluded?i:-1).filter(i=>i>=0)};}
function saveSession(){
  clearTimeout(sessT);
  sessT=setTimeout(()=>kvSet('session:last',JSON.stringify({when:Date.now(),
    parts:parts.map(partSnap)})),300);
}
async function restoreSession(){
  try{
    const v=await kvGet('session:last');
    if(!v)return;
    const s=JSON.parse(v);
    if(!s.parts||!s.parts.length)return;
    parts=s.parts.map(x=>{const n=normalize({properties:x.props,geometry:x.geometry});
      n.bldgSF=x.bldgSF!=null?x.bldgSF:null;n._ex=x.ex||[];return n;});
    if(parts.length>1)curAsmKey=skey(parts.map(p=>p.id).sort().join('+'));
    await rebuildSubject(true);
  }catch(e){}
}

/* ---------- saved assemblages: sticky to their member parcels ---------- */
let asmIndex={},curAsmKey=null;
async function loadAsmIndex(){
  const v=await kvGet('asm-index');
  if(v){try{asmIndex=JSON.parse(v);}catch(e){}}
}
function writeAsmIndex(){return kvSet('asm-index',JSON.stringify(asmIndex));}
async function persistAssembly(){
  if(parts.length<2){await forgetAssembly();return;}
  const key=skey(subject.id);
  if(curAsmKey&&curAsmKey!==key)await forgetAssembly(curAsmKey,false);
  await kvSet('asm:'+key,JSON.stringify(
    {when:Date.now(),parts:parts.map(partSnap)}));
  Object.keys(asmIndex).forEach(k=>{if(asmIndex[k]===key)delete asmIndex[k];});
  parts.forEach(p=>asmIndex[skey(p.id)]=key);
  curAsmKey=key;
  await writeAsmIndex();
}
async function forgetAssembly(key,clearCur=true){
  key=key||curAsmKey;
  if(!key)return;
  await kvDel('asm:'+key);
  Object.keys(asmIndex).forEach(k=>{if(asmIndex[k]===key)delete asmIndex[k];});
  if(clearCur)curAsmKey=null;
  await writeAsmIndex();
}
async function restoreAssembly(key){
  try{
    const v=await kvGet('asm:'+key);
    if(!v)return false;
    const s=JSON.parse(v);
    if(!s.parts||s.parts.length<2)return false;
    parts=s.parts.map(x=>{const n=normalize({properties:x.props,geometry:x.geometry});
      n.bldgSF=x.bldgSF!=null?x.bldgSF:null;n._ex=x.ex||[];return n;});
    curAsmKey=key;
    broker=await loadBroker(skey(parts.map(p=>p.id).sort().join('+')));
    await rebuildSubject(true,false);
    return true;
  }catch(e){return false;}
}
window.disbandAsm=async()=>{await forgetAssembly();parts=[parts[0]];await rebuildSubject(true);};
function aggregate(ps){
  const a=ps[0];
  if(ps.length===1)return a;
  const owners=[...new Set(ps.map(p=>p.owner))];
  const sum=f=>ps.some(p=>p[f]!=null)?ps.reduce((s,p)=>s+(p[f]||0),0):null;
  const sfKnown=ps.every(p=>p.bldgSF!=null);
  let cx=0,cy=0;ps.forEach(p=>{cx+=p.centroid[0];cy+=p.centroid[1]});
  return{raw:a.raw,geometry:null,parts:ps,isAssembly:true,
    id:ps.map(p=>p.id).sort().join('+'),
    audId:ps.length+'-parcel assemblage',
    address:a.address+'  (+'+(ps.length-1)+' parcel'+(ps.length>2?'s':'')+')',
    owner:owners.join('  ·  '),owner2:'',mail:a.mail,
    acres:sum('acres'),cls:a.cls,bucket:a.bucket,use:a.use,
    saleDate:null,saleAmt:null,valid:true,numPcl:ps.length,foreclosure:false,prevOwner:'',
    mktTotal:sum('mktTotal'),taxes:sum('taxes'),
    taxDst:a.taxDst,school:a.school,
    bldgSF:sfKnown?sum('bldgSF'):null,
    centroid:[cx/ps.length,cy/ps.length]};
}
function drawSubject(fit){
  subjLayer.clearLayers();
  const style={color:'#60A5FA',weight:2.5,fillColor:'#60A5FA',fillOpacity:.16};
  let drawn=false;
  if(parts.length>1&&window.turf){
    try{
      let u=null;
      parts.forEach(p=>{const f={type:'Feature',properties:{},geometry:p.geometry};
        u=u?turf.union(u,f):f;});
      if(u){L.geoJSON(u,{style}).addTo(subjLayer);drawn=true;}
    }catch(e){}
  }
  if(!drawn)parts.forEach(p=>L.geoJSON({type:'Feature',geometry:p.geometry},{style}).addTo(subjLayer));
  if(fit){try{
    const g=L.featureGroup(parts.map(p=>L.geoJSON({type:'Feature',geometry:p.geometry})));
    map.fitBounds(g.getBounds().pad(.6));
  }catch(e){}}
}
async function fetchPartSF(part){
  if(demoMode){
    part.bldgs=demoBldgs(part);
  }else{
    try{
      const j=await arc(BUILDINGS,{geometry:JSON.stringify(esriPoly(part.geometry)),
        geometryType:'esriGeometryPolygon',inSR:4326,spatialRel:'esriSpatialRelIntersects',
        outFields:'SQFT,EST_STORY,STORYABOVE,EST_H_FEET',returnGeometry:true,
        geometryPrecision:6,where:`SQFT >= ${MIN_BLDG}`});
      part.bldgs=(j.features||[]).map(f=>({geometry:f.geometry,
        sqft:num(f.properties.SQFT)||0,
        stories:Math.min(4,Math.max(1,num(f.properties.EST_STORY)||num(f.properties.STORYABOVE)||1)),
        hft:num(f.properties.EST_H_FEET),excluded:false}));
    }catch(e){part.bldgs=[];}
  }
  if(part._ex&&part.bldgs){part._ex.forEach(i=>{if(part.bldgs[i])part.bldgs[i].excluded=true;});delete part._ex;}
  recalcPartSF(part);
  subject=aggregate(parts);
  drawBuildings();
  if(curView==='peek'||curView==='full')view(curView);
}
function recalcPartSF(part){
  part.bldgSF=(part.bldgs||[]).filter(b=>!b.excluded)

window.toggleBldg=(pi,bi)=>{

function demoBldgs(part){
  const bsf=num(part.raw.BLDGSF)||0;
  if(!bsf)return[];
  const ring=outerRing(part.geometry);
  let xs=ring.map(p=>p[0]),ys=ring.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const w=(Math.max(...xs)-Math.min(...xs))*.55,h=(Math.max(...ys)-Math.min(...ys))*.55;
  return[{geometry:{type:'Polygon',coordinates:[[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2],[cx-w/2,cy-h/2]]]},
    sqft:bsf,stories:1,hft:28,excluded:false}];
}
function esriPoly(g){
  const rings=g.type==='Polygon'?g.coordinates:g.coordinates.flat(1);
  return{rings,spatialReference:{wkid:4326}};
}
function effSF(){return broker.sf||subject.bldgSF||0;}

/* ---------- normalize ---------- */
function normalize(f){
  const p=f.properties||{};
  const cls=num(p.CLASS);
  return{raw:p,geometry:f.geometry,
    id:p.PARCELID||p.AUDPCLID||String(p.OBJECTID),
    audId:p.AUDPCLID||p.PARCELID||'—',
    address:[p.ADDRNO,p.ADDRST,p.ADDRSF].filter(Boolean).join(' ')||'No situs address',
    owner:p.OWNNM1||'—',owner2:p.OWNNM2||'',
    mail:[p.MLADR1,p.MLADR2].filter(Boolean).join(', '),
    acres:num(p.ACREDEED),cls,bucket:bucketOf(cls),
    use:p.EXLUCODE||(cls!=null?String(cls):''),
    saleDate:p.SALDAT?new Date(num(p.SALDAT)):null,
    saleAmt:num(p.SALAMT),
    valid:VALID_YES.has(String(p.VALID??'').trim().toUpperCase()),
    numPcl:num(p.NUMPCL)||1,
    foreclosure:String(p.FORECL_FLAG??'').trim().toUpperCase()==='Y',
    prevOwner:p.PREVOWN1||'',
    mktTotal:num(p.MKT_TOTAL_VAL),taxes:num(p.ANNUAL_TAXES),
    taxDst:p.TAXDST_DIS||'',school:p.SCHOOL_CODE_DIS||'',
    bldgSF:null,centroid:centroidOf(f.geometry)};
}
function num(v){const n=Number(v);return isFinite(n)?n:null;}
function bucketOf(cls){
  if(cls==null)return null;
  if(cls>=300&&cls<400)return{lo:300,hi:399,name:'Industrial'};
  if(cls>=400&&cls<500)return{lo:400,hi:499,name:'Commercial'};
  if(cls>=500&&cls<600)return{lo:500,hi:599,name:'Residential'};
  if(cls>=100&&cls<200)return{lo:100,hi:199,name:'Agricultural'};
  if(cls>=600)return{lo:600,hi:699,name:'Exempt'};
  return{lo:0,hi:999,name:'Class '+cls};
}

/* ---------- persistence: memory-first, durable storage as backup ----------
   In-session saves ALWAYS work (memory). Cross-session survives when the
   environment provides window.storage (claude.ai artifacts) OR when a
   backend is configured below (Supabase — works on any static host). */

/* >>> BACKEND CONFIG — paste your Supabase values here (see setup notes).
   url:  your project URL, e.g. https://abcdefgh.supabase.co
   key:  the ANON/PUBLISHABLE key (never the service_role key)
   ws:   workspace id — any long random string; acts as your data namespace */
const BACKEND={url:'',key:'',ws:''};

const mem={};
let remoteOK=false;
function rHeaders(){return{'apikey':BACKEND.key,'Authorization':'Bearer '+BACKEND.key,'Content-Type':'application/json'};}
async function hydrateRemote(){
  if(!BACKEND.url||!BACKEND.key||!BACKEND.ws)return;
  try{
    const r=await fetch(`${BACKEND.url}/rest/v1/kv?workspace=eq.${encodeURIComponent(BACKEND.ws)}&select=k,v`,
      {headers:rHeaders()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    (await r.json()).forEach(row=>{mem[row.k]=row.v;});
    remoteOK=true;
  }catch(e){console.warn('backend offline — running on session memory',e.message);}
}
function remoteSet(k,v){
  if(!remoteOK)return;
  fetch(`${BACKEND.url}/rest/v1/kv`,{method:'POST',
    headers:{...rHeaders(),'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{workspace:BACKEND.ws,k,v}])}).catch(()=>{});
}
function remoteDel(k){
  if(!remoteOK)return;
  fetch(`${BACKEND.url}/rest/v1/kv?workspace=eq.${encodeURIComponent(BACKEND.ws)}&k=eq.${encodeURIComponent(k)}`,
    {method:'DELETE',headers:rHeaders()}).catch(()=>{});
}
async function kvGet(k){
  if(k in mem)return mem[k];
  try{if(window.storage){const r=await window.storage.get(k);
    if(r&&r.value!=null){mem[k]=r.value;return r.value;}}}catch(e){}
  return null;
}
async function kvSet(k,v){ mem[k]=v; remoteSet(k,v); try{if(window.storage)await window.storage.set(k,v);}catch(e){} }
async function kvDel(k){ delete mem[k]; remoteDel(k); try{if(window.storage)await window.storage.delete(k);}catch(e){} }

/* ---------- broker layer ---------- */
function skey(id){return String(id).replace(/[\s\/\\'"]+/g,'_');}   // storage-safe key
function emptyBroker(){return{sf:null,notes:'',photos:[],contacts:[],comps:[]};}
async function rawLoad(id){
  const v=await kvGet('broker:'+skey(id));
  if(v){try{return JSON.parse(v);}catch(e){}}
  return null;
}
function mergeBroker(a,b){
  if(!b)return a;
  const m={...a};
  m.notes=[a.notes,b.notes].filter(Boolean).join('\n');
  m.photos=[...a.photos,...b.photos].slice(0,6);
  m.contacts=[...a.contacts,...b.contacts];
  m.comps=[...a.comps,...b.comps];
  if(b.sf)m.sf=(a.sf||0)+b.sf;
  return m;
}
async function loadBroker(id){
  const own=await rawLoad(id);
  if(own)return own;
  if(parts.length>1){                       // new assemblage: inherit each parcel's saved layer
    let m=emptyBroker();
    for(const p of parts)m=mergeBroker(m,await rawLoad(p.id));
    return m;
  }
  return emptyBroker();
}
let saveT=null;

  clearTimeout(saveT);

}

function svPoint(){
  // Always anchor to the PRIMARY parcel — the one whose situs address is on the record —
  // so assemblage Street View opens at the addressed building, not a back-lot parcel.
  const prime=parts[0];
  if(prime){
    const b=(prime.bldgs||[]).find(b=>!b.excluded);
    if(b){const c=centroidOf(b.geometry);if(c)return c;}
    if(prime.centroid)return prime.centroid;
  }
  return subject.centroid;
}
window.openSV=c=>{
  c=c||svPoint();
  window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+c[1]+','+c[0],'_blank');
};

function shrink(file){return new Promise(res=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');
    const k=Math.min(1,520/Math.max(img.width,img.height));
    c.width=img.width*k;c.height=img.height*k;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.72));};
  img.src=URL.createObjectURL(file);});}

async function runComps(){
  if(assembling)endAssembly();
  body(`<div class="addr" style="font-size:16px;display:flex;gap:10px;align-items:center"><span class="spin"></span> Pulling county sales & building data…</div>`,'peek');
  let feats=[],bldgs=[],months=LOOKBACK_MO;
  try{
    feats=await fetchComps(months);
    if(feats.length<4){months=LOOKBACK_EXT;feats=await fetchComps(months);}
    if(!demoMode)bldgs=await fetchBuildingsEnvelope();
  }catch(e){enterDemo(e.name==='AbortError'?'timeout':e.message);feats=demoComps(months);}
  if(demoMode&&!feats.length)feats=demoComps(months);
  lastMonths=months;
  const partIds=new Set(parts.map(p=>p.id));
  compPool=feats.map(normalize).filter(c=>!partIds.has(c.id)&&c.saleAmt>=MIN_SALE&&c.saleDate&&useMatch(c));
  if(demoMode){compPool.forEach(c=>c.bldgSF=num(c.raw.BLDGSF)||0);}
  else{
    compPool.forEach(c=>c.bldgSF=0);
    for(const b of bldgs){
      const ctr=centroidOf(b.geometry);if(!ctr)continue;
      const host=compPool.find(c=>c.geometry&&ptInPoly(ctr,outerRing(c.geometry)));
      if(host)host.bldgSF+=bldgArea(b.properties);
    }
  }
  broker.comps.forEach((b,i)=>compPool.push({
    id:'BK'+i,audId:'BROKER',address:b.addr,owner:'Private record',
    saleDate:parseLoose(b.date),saleAmt:b.amt,bldgSF:b.sf,acres:null,
    use:subject.use,valid:true,numPcl:1,foreclosure:false,prevOwner:'',
    centroid:subject.centroid,geometry:null,isBroker:true}));
  compPool=compPool.map(c=>scoreComp(c,months)).sort((a,b)=>b.score-a.score);
  pickBand();
  selectedIds.clear();
  compPool.filter(c=>inBand(c)&&!c.flags.some(f=>f.cls==='bad')&&c.psf).slice(0,6).forEach(c=>selectedIds.add(c.id));
  if(selectedIds.size<4)compPool.filter(c=>inBand(c)&&!selectedIds.has(c.id)&&c.psf).slice(0,4-selectedIds.size).forEach(c=>selectedIds.add(c.id));
  view('comps');
}
window.runComps=runComps;

function envelope(){
  const[lng,lat]=subject.centroid;
  const dy=radiusMi/69,dx=radiusMi/(69*Math.cos(lat*Math.PI/180));
  return{xmin:lng-dx,ymin:lat-dy,xmax:lng+dx,ymax:lat+dy,spatialReference:{wkid:4326}};
}
async function fetchComps(months){
  if(demoMode)return demoComps(months);
  const d=new Date();d.setMonth(d.getMonth()-months);
  const b=useBounds();
  let where=`SALDAT >= DATE '${d.toISOString().slice(0,10)}' AND SALAMT >= ${MIN_SALE} AND CLASS >= ${b.lo} AND CLASS <= ${b.hi}`;
  if(useFilter==='exact'&&subject.use)where+=` AND EXLUCODE = '${String(subject.use).replace(/'/g,"''")}'`;
  const j=await arc(PARCELS,{geometry:JSON.stringify(envelope()),geometryType:'esriGeometryEnvelope',
    inSR:4326,spatialRel:'esriSpatialRelIntersects',where,
    outFields:'*',returnGeometry:true,resultRecordCount:250,orderByFields:'SALDAT DESC'});
  return j.features||[];
}
async function fetchBuildingsEnvelope(){
  const j=await arc(BUILDINGS,{geometry:JSON.stringify(envelope()),geometryType:'esriGeometryEnvelope',
    inSR:4326,spatialRel:'esriSpatialRelIntersects',where:`SQFT >= ${MIN_BLDG}`,
    outFields:'SQFT,EST_STORY,STORYABOVE',returnGeometry:true,
    geometryPrecision:5,maxAllowableOffset:.0002,resultRecordCount:2000});
  return j.features||[];
}

/* ---------- size band: only show comps in a similar building-size range ---------- */
let sizeBand='tight';
const BANDS={tight:[.5,2],wide:[1/3,3],all:[0,Infinity]};
const BANDLBL={tight:'±50%',wide:'WIDE',all:'ALL'};
function inBand(c){
  if(c.isBroker)return true;                 // broker chose to add it
  const sSF=effSF();
  if(!sSF)return true;                       // no subject building → no SF filter
  if(!c.bldgSF)return false;                 // land-only excluded when subject has a building
  const r=c.bldgSF/sSF,[lo,hi]=BANDS[sizeBand];
  return r>=lo&&r<=hi;
}
function pickBand(){
  const order=['tight','wide','all'];
  for(let i=Math.max(0,order.indexOf(sizeBand));i<order.length;i++){
    sizeBand=order[i];
    if(compPool.filter(c=>inBand(c)&&c.psf).length>=4)return;
  }
}
window.setBand=b=>{
  sizeBand=b;
  savePrefs();
  [...selectedIds].forEach(id=>{const c=compPool.find(x=>x.id===id);
    if(c&&!inBand(c))selectedIds.delete(id);});
  renderComps();
};

function scoreComp(c,months){
  const flags=[];
  if(c.isBroker)flags.push({t:'BROKER COMP',cls:'info'});
  else{
    if(!c.valid)flags.push({t:'UNVERIFIED CONVEYANCE',cls:'warn'});
    if(c.numPcl>1)flags.push({t:`MULTI-PARCEL ×${c.numPcl}`,cls:'warn'});
    if(c.foreclosure)flags.push({t:'FORECLOSURE',cls:'bad'});
    if(relatedParty(c))flags.push({t:'POSSIBLE RELATED-PARTY',cls:'bad'});
  }
  c.psf=(c.bldgSF&&c.bldgSF>0)?c.saleAmt/c.bldgSF:null;
  c.ppa=(c.acres&&c.acres>0)?c.saleAmt/c.acres:null;
  if(!c.psf&&!c.isBroker)flags.push({t:'LAND ONLY — NO BLDG',cls:'warn'});
  const ageMo=c.saleDate?(Date.now()-c.saleDate.getTime())/2629800000:months;
  const rec=Math.max(0,1-ageMo/months);
  const distMi=haversineMi(subject.centroid,c.centroid);
  const dist=c.isBroker?1:Math.max(0,1-distMi/radiusMi);
  const sSF=effSF();
  let size=.5;
  if(sSF&&c.bldgSF)size=Math.min(sSF,c.bldgSF)/Math.max(sSF,c.bldgSF);
  else if(subject.acres&&c.acres)size=Math.min(subject.acres,c.acres)/Math.max(subject.acres,c.acres);
  const use=(c.use&&subject.use&&c.use===subject.use)?1:.6;
  const penalty=flags.filter(f=>f.cls!=='info').length*12;
  c.score=Math.max(2,Math.round(100*(.30*rec+.25*dist+.25*size+.20*use)-penalty));
  c.flags=flags;c.distMi=distMi;c.ageMo=ageMo;
  return c;
}
function relatedParty(c){
  if(!c.owner||!c.prevOwner)return false;
  const a=c.owner.toUpperCase().replace(/[^A-Z]/g,''),b=c.prevOwner.toUpperCase().replace(/[^A-Z]/g,'');
  return a.slice(0,6)&&a.slice(0,6)===b.slice(0,6);
}

/* ---------- utils ---------- */
function outerRing(g){return g.type==='Polygon'?g.coordinates[0]:g.coordinates[0][0];}
function centroidOf(g){if(!g)return null;
  const r=outerRing(g);let x=0,y=0;r.forEach(p=>{x+=p[0];y+=p[1]});
  return[x/r.length,y/r.length];}
function haversineMi(a,b){if(!a||!b)return 0;
  const R=3958.8,dLa=(b[1]-a[1])*Math.PI/180,dLo=(b[0]-a[0])*Math.PI/180;
  const h=Math.sin(dLa/2)**2+Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
function ptInPoly(pt,ring){let ins=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}
  return ins;}
function parseLoose(s){const d=new Date(s);return isNaN(d)?new Date():d;}
function money(v){return v==null?'—':'$'+Math.round(v).toLocaleString('en-US');}
function fmtN(v){return v==null?'—':Math.round(v).toLocaleString('en-US');}
function fmtD(d){return d?d.toLocaleDateString('en-US',{month:'short',year:'numeric'}):'—';}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- demo data ---------- */
function rect(lat,lng,w,h){
  // deterministic pseudo-random rotation + corner jitter so parcels read as real parcel fabric
  const seed=Math.abs(Math.sin(lat*7919+lng*104729))*10000;
  const rnd=i=>{const x=Math.sin(seed+i*37.7)*43758.5453;return x-Math.floor(x);};
  const rot=(rnd(0)-.5)*.42;                       // up to ~12 degrees
  const dy=h/69/2,dx=w/(69*Math.cos(lat*Math.PI/180))/2;
  const base=[[-dx,-dy],[dx,-dy],[dx,dy],[-dx,dy]];
  const ring=base.map((p,i)=>{
    const jx=p[0]*(1+(rnd(i+1)-.5)*.3), jy=p[1]*(1+(rnd(i+5)-.5)*.3);
    return [lng + jx*Math.cos(rot)-jy*Math.sin(rot),
            lat + jx*Math.sin(rot)+jy*Math.cos(rot)];
  });
  ring.push(ring[0]);
  return {type:'Polygon',coordinates:[ring]};
}
function dmo(id,addr,owner,cls,use,ac,bsf,saleISO,amt,o={}){

    PARCELID:id,AUDPCLID:id,ADDRNO:addr.split(' ')[0],ADDRST:addr.split(' ').slice(1).join(' '),ADDRSF:'',
    OWNNM1:owner,MLADR1:owner.includes('LLC')?'PO BOX 145, CALDER OH 45299':'7400 CALDERWOOD PKWY, CALDER OH 45299',
    CLASS:cls,EXLUCODE:use,ACREDEED:ac,BLDGSF:bsf,
    SALDAT:saleISO?new Date(saleISO).getTime():null,SALAMT:amt,VALID:o.valid===false?'N':'Y',
    NUMPCL:o.numPcl||1,FORECL_FLAG:o.forecl?'Y':'N',PREVOWN1:o.prev||'',
    MKT_TOTAL_VAL:o.mkt||(amt?amt*.92:bsf*62),ANNUAL_TAXES:Math.round(ac*6200),
    TAXDST_DIS:'CALDERWOOD TWP-MERIDIAN LSD',SCHOOL_CODE_DIS:'MERIDIAN LSD'}};}
